<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUSI BALINGASAG PLATE</title>
<meta name="description" content="Check the status of your motorcycle plate at RUSI Balingasag Branch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--red-d:#9f0c24;--ink:#1c1e23;--mute:#5e6572;--line:#dcdfe5;--bg:#eef0f3;--card:#fff;--plate:#f6cf3d;--ok:#157347;--wait:#9a5b00}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(rgba(16,19,26,.62),rgba(16,19,26,.62)),url("background.webp") center/cover fixed no-repeat,#1c1e23;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.top{background:rgba(28,30,35,.88);border-bottom:5px solid var(--red);padding:34px 20px 30px}
.top .in{max-width:560px;margin:0 auto}
h1{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.1rem,7vw,3rem);line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#fff;margin:0 0 10px}
.top p{margin:0;color:#c3c7d0;font-size:1.02rem;line-height:1.5}
main{width:100%;max-width:560px;margin:-18px auto 0;padding:0 16px 28px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:0 6px 22px rgba(20,24,34,.10)}
label{display:block;font-weight:600;margin:0 0 7px}
.field{margin-bottom:18px}
.plate{background:var(--plate);border:3px solid var(--ink);border-radius:8px;padding:3px;box-shadow:inset 0 0 0 2px #fff6}
.plate input{width:100%;border:0;background:transparent;text-align:center;font:700 2.1rem/1.25 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:6px}
.plate input::placeholder{color:#1c1e2355}
.plate input:focus{outline:none}
.plate:focus-within,.name:focus{outline:3px solid #c8102e55;outline-offset:2px}
.name{width:100%;border:1.5px solid #b9bec8;border-radius:6px;padding:13px 14px;font:inherit;font-size:1.08rem;color:var(--ink);background:#fff}
.name:focus{border-color:var(--red)}
small{display:block;color:var(--mute);margin-top:7px;font-size:.88rem;line-height:1.4}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.9rem;margin:2px 0 18px}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
button{width:100%;background:var(--red);color:#fff;border:0;border-radius:6px;padding:15px;font:600 1.08rem Barlow,Arial,sans-serif;letter-spacing:.02em;cursor:pointer;transition:background .15s}
button:hover{background:var(--red-d)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.65;cursor:wait}
#result{margin-top:22px}
.res{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:15px 16px;margin-top:10px;background:#fafbfc}
.res .pl{font:700 1.6rem/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.1em}
.res .br{color:var(--mute);font-size:.92rem;margin-top:6px}
.badge{white-space:nowrap;padding:6px 12px;border-radius:99px;font-weight:600;font-size:.9rem;color:#fff}
.badge.ok{background:var(--ok)}.badge.wait{background:var(--wait)}
.msg{border:1px solid #e9bcb7;background:#fdf2f1;color:#9c1c12;border-radius:6px;padding:14px 16px;line-height:1.45}
footer{text-align:center;color:#d5d9e0;font-size:.88rem;line-height:1.55;padding:6px 20px 30px;max-width:560px;margin:0 auto}
@media(max-width:420px){.res{flex-direction:column;align-items:flex-start}.card{padding:18px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>RUSI BALINGASAG PLATE</h1>
  <p>Check the status of your motorcycle plate. Search by plate number, by name, or both.</p>
</div></div>

<main>
  <div class="card">
    <form id="f" autocomplete="off">
      <div class="field">
        <label for="plate">Plate number</label>
        <div class="plate"><input id="plate" maxlength="10" placeholder="ABC 1234"></div>
      </div>
      <div class="or">or</div>
      <div class="field">
        <label for="code">Name</label>
        <input class="name" id="code" maxlength="60" placeholder="Juan Dela Cruz">
        <small>Type at least 4 letters. Your last name or full name works.</small>
      </div>
      <button id="go" type="submit">Check status</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </div>
</main>

<footer>RUSI Balingasag Branch<br>Wrong result or no record found? Please visit or contact the branch.</footer>

<script>
const SUPABASE_URL = "https://lfcbawmlhyngbytnmetm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KolO_-pCM806HZbKufuTHg_hxC5F7Vl";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("go"), out = $("result");
  const plateV = $("plate").value.trim(), nameV = $("code").value.trim();
  const letters = nameV.replace(/[^A-Za-z]/g, "").length;
  if (!plateV && !nameV) { out.innerHTML = '<div class="msg">Type a plate number or a name.</div>'; return; }
  if (!plateV && letters < 4) { out.innerHTML = '<div class="msg">Type at least 4 letters of the name.</div>'; return; }
  btn.disabled = true; btn.textContent = "Checking…"; out.innerHTML = "";
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/lookup_plate", {
      method: "POST",
      headers: {"Content-Type":"application/json", apikey: SUPABASE_ANON_KEY},
      body: JSON.stringify({p_plate: plateV, p_name: nameV})
    });
    if (!r.ok) throw new Error("server");
    const rows = await r.json();
    if (!rows.length) {
      out.innerHTML = '<div class="msg">No record found. Check the spelling, then try again.</div>';
    } else {
      out.innerHTML = rows.map(p => {
        const done = /releas|ready|claimed|done/i.test(p.status || "");
        return '<div class="res"><div><div class="pl">' + esc(p.plate) + '</div><div class="br">' + esc(p.branch) + '</div></div>' +
          '<span class="badge ' + (done ? "ok" : "wait") + '">' + esc(p.status || "Processing") + '</span></div>';
      }).join("");
    }
  } catch (err) {
    out.innerHTML = '<div class="msg">We could not check right now. Check your internet connection and try again.</div>';
  }
  btn.disabled = false; btn.textContent = "Check status";
});
</script>
</body>
</html>
