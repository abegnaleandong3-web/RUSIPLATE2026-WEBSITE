<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUSI Plate Status Check</title>
<meta name="description" content="Check the status of your motorcycle plate with RUSI Plate Management.">
<style>
:root{--ink:#16213a;--paper:#f3f5f8;--card:#fff;--plate:#f2c94c;--line:#d8dee8;--ok:#1b7f4b;--wait:#a86a00;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
header{text-align:center;max-width:520px;margin-bottom:24px}
h1{font-size:1.7rem;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;color:#4a5670;line-height:1.5}
main{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.plate{background:var(--plate);border:3px solid var(--ink);border-radius:10px;padding:4px}
.plate input{width:100%;border:0;background:transparent;text-align:center;font:700 1.9rem/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:8px}
.plate input:focus{outline:none}
.plate:focus-within{box-shadow:0 0 0 3px #16213a55}
.code{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:1.05rem;text-align:center}
.code:focus{outline:2px solid var(--ink);outline-offset:1px}
.field{margin-bottom:16px}
small{display:block;color:#5d6882;margin-top:6px}
button{width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:14px;font-size:1rem;font-weight:600;cursor:pointer}
button:hover{background:#0e1730}
button:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
#result{margin-top:20px}
.res{border-radius:10px;padding:16px;border:1px solid var(--line);background:var(--paper)}
.res h2{margin:0 0 4px;font-size:1.3rem;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:600;font-size:.9rem;color:#fff;margin:6px 0 10px}
.badge.ok{background:var(--ok)}.badge.wait{background:var(--wait)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
dt{color:#5d6882}dd{margin:0;font-weight:600}
.err{color:var(--err);border-color:#e7b9b5;background:#fdf1f0}
footer{margin-top:20px;color:#5d6882;font-size:.85rem;text-align:center;max-width:480px;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Check your plate status</h1>
  <p>Enter your plate number and your name as registered with us.</p>
</header>

<main>
  <form id="f" autocomplete="off">
    <div class="field">
      <label for="plate">Plate number</label>
      <div class="plate"><input id="plate" maxlength="10" placeholder="ABC 1234" required></div>
    </div>
    <div class="field">
      <label for="code">Your name (as registered)</label>
      <input class="code" id="code" maxlength="60" placeholder="Juan Dela Cruz" required>
      <small>Type your last name or full name. This keeps other people from viewing your record.</small>
    </div>
    <button id="go" type="submit">Check status</button>
  </form>
  <div id="result" aria-live="polite"></div>
</main>

<footer>Wrong result or no record found? Contact the RUSI branch where you bought your motorcycle.</footer>

<script>
// ====== EDIT THESE TWO (same values as your index.html) ======
const SUPABASE_URL = "https://lfcbawmlhyngbytnmetm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KolO_-pCM806HZbKufuTHg_hxC5F7Vl";
// =============================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"}) : "—";

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("go"), out = $("result");
  btn.disabled = true; btn.textContent = "Checking…"; out.innerHTML = "";
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/lookup_plate", {
      method: "POST",
      headers: {"Content-Type":"application/json", apikey: SUPABASE_ANON_KEY},
      body: JSON.stringify({p_plate: $("plate").value.trim(), p_name: $("code").value.trim()})
    });
    if (!r.ok) throw new Error("server");
    const rows = await r.json();
    if (!rows.length) {
      out.innerHTML = '<div class="res err">No record found. Check the plate number and your name as registered, then try again.</div>';
    } else {
      const p = rows[0];
      const done = /releas|ready|claimed|done/i.test(p.status || "");
      out.innerHTML = '<div class="res"><h2>' + esc(p.plate) + '</h2>' +
        '<span class="badge ' + (done ? "ok" : "wait") + '">' + esc(p.status || "Processing") + '</span>' +
        '<dl><dt>Branch</dt><dd>' + esc(p.branch) + '</dd></dl></div>';
    }
  } catch (err) {
    out.innerHTML = '<div class="res err">We could not check right now. Check your internet connection and try again.</div>';
  }
  btn.disabled = false; btn.textContent = "Check status";
});
</script>
</body>
</html>
